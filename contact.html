<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Siddharthruggs</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="site-header"></header>

  <section class="simple-page">
    <h1>Contact Us</h1>
    <p>Have a question about a rug, sizing, or an order? Reach out any time.</p>

    <ul class="contact-list" id="contact-list"></ul>

    <a href="#" id="contact-whatsapp" class="btn btn-whatsapp" style="margin-top:20px;">
      Message on WhatsApp
    </a>
  </section>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    renderHeader("contact");
    renderFooter();

    document.getElementById("contact-list").innerHTML = `
      <li><strong>WhatsApp:</strong> ${CONFIG.phone}</li>
      <li><strong>Phone:</strong> ${CONFIG.phone}</li>
      <li><strong>Email:</strong> ${CONFIG.email}</li>
      <li><strong>Address:</strong> ${CONFIG.address}</li>
    `;
    document.getElementById("contact-whatsapp").href =
      "https://wa.me/" + CONFIG.whatsappNumber;
  </script>
</body>
</html>
