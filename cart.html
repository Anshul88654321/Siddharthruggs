<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart — Siddharthruggs</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="site-header"></header>

  <section class="section">
    <h2>Your Cart</h2>

    <p class="empty-state" id="cart-empty" style="display:none;">
      Your cart is empty. <a href="shop.html">Browse rugs</a>
    </p>

    <div id="cart-table-wrap" style="overflow-x:auto;">
      <table class="cart-table">
        <thead>
          <tr>
            <th>Rug</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Subtotal</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="cart-body"></tbody>
      </table>
    </div>

    <div class="cart-summary" id="cart-summary">
      <div class="cart-summary-box">
        <div class="cart-total-row">
          <span>Total</span>
          <span id="cart-total">₹0</span>
        </div>
        <button class="btn btn-whatsapp btn-block" id="cart-whatsapp-btn">Order on WhatsApp</button>
      </div>
    </div>
  </section>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    renderHeader("cart");
    renderFooter();
  </script>
  <script src="js/cart-page.js"></script>
</body>
</html>
